<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiv Shakti Kirana Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;font-family:'Poppins',sans-serif}
body{background:#f2f4f7;padding-bottom:90px}
.top{background:#1a1625;color:#fff;padding:18px 16px 36px;border-radius:0 0 28px 28px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:18px;line-height:1.2}
.search{margin:-22px 14px 16px;background:#fff;border-radius:24px;padding:12px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.search input{border:0;outline:0;flex:1;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 12px}
.scard{border-radius:18px;padding:12px;box-shadow:0 6px 14px rgba(0,0,0,.08)}
.scard b{font-size:18px;display:block;margin-top:4px}
.scard small{font-size:10px;color:green;font-weight:700}
.title{padding:20px 14px 10px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px}
.title span{color:#2563eb;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 12px}
.gcard{border-radius:22px;padding:18px;text-align:center;color:#1e1b4b;box-shadow:0 10px 20px rgba(0,0,0,.12);position:relative;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gcard .ico{font-size:42px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.gcard b{margin-top:8px;font-size:15px;color:#0f172a}
.c1{background:linear-gradient(135deg,#a78bfa,#6366f1)}
.c2{background:linear-gradient(135deg,#fb923c,#ef4444)}
.c3{background:linear-gradient(135deg,#5eead4,#06b6d4)}
.c4{background:linear-gradient(135deg,#f9a8d4,#ec4899)}
.c5{background:linear-gradient(135deg,#4ade80,#22c55e)}
.c6{background:linear-gradient(135deg,#93c5fd,#6366f1)}
.bottom{position:fixed;left:10px;right:10px;bottom:10px;background:#fff;border-radius:24px;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.bottom div{text-align:center;font-size:11px;color:#6b7280}
.bottom .active{color:#1e40af;font-weight:800}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;gap:10px;align-items:center"><div style="background:rgba(255,255,255,.1);padding:8px;border-radius:10px">🏪</div><h1>Shiv Shakti<br>Kirana</h1></div>
<div style="display:flex;gap:14px;font-size:20px">🔔 🎧 👤</div>
</div>

<div class="search">🔍 <input placeholder="Search for products, SKUs, or categories..."><span>🎤</span><span>⚙️</span></div>

<div style="text-align:center;font-size:11px;letter-spacing:3px;color:#6b7280;margin:10px 0">STATS OVERVIEW</div>
<div class="stats">
<div class="scard" style="background:linear-gradient(#e0f2fe,#bae6fd)">📈<br><small style="color:#000">Total Orders</small><b>128</b><small>+12 today ↑ 8.5%</small></div>
<div class="scard" style="background:linear-gradient(#dcfce7,#bbf7d0)">💵<br><small style="color:#000">Today's Revenue</small><b>₹12,450</b><small>+₹2,100 ↑ 18%</small></div>
<div class="scard" style="background:linear-gradient(#ffedd5,#fed7aa)">👥<br><small style="color:#000">Active Customers</small><b>54</b><small>+5 new ↑ 10%</small></div>
</div>

<div class="title"><div>Categories</div><span>View all →</span></div>

<div class="grid">
<div class="gcard c1"><div class="ico">📊</div><b>Sales</b></div>
<div class="gcard c2"><div class="ico">⏳</div><b>Expiry</b></div>
<div class="gcard c3"><div class="ico">📦</div><b>Stock</b></div>
<div class="gcard c4"><div class="ico">📝</div><b>Udhaari</b></div>
<div class="gcard c5"><div class="ico">📈</div><b>Profit</b></div>
<div class="gcard c6"><div class="ico">🧾</div><b>Bills</b></div>
</div>

<div class="bottom">
<div class="active">🏠<br>Home</div><div>📋<br>Orders</div><div>📦<br>Inventory</div><div>👥<br>Customers</div><div>👤<br>Profile</div>
</div>

<script>
// Live clock example - aap isko sales se jod sakte ho
console.log("Shiv Shakti Kirana Pro Loaded - Har Har Mahadev");
</script>
</body>
</html>

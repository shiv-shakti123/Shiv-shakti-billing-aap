<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiv Shakti Billing</title>
<style>
body{margin:0;font-family:system-ui;background:#f6f1eb}
.h{background:linear-gradient(135deg,#ff6f00,#ff9d00);color:#fff;padding:22px;text-align:center;border-radius:0 0 22px 22px}
.box{background:#fff;margin:15px;padding:18px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
input{width:100%;padding:12px;margin:6px 0 12px;border:1.5px solid #e7d9c7;border-radius:12px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.qty{width:50px;text-align:center;font-weight:700}
.btn{width:38px;height:38px;border-radius:50%;border:none;background:#ffe4c4;font-size:20px}
.btn2{background:#ff6f00;color:#fff}
.mainbtn{width:100%;background:linear-gradient(135deg,#ff6f00,#ff9d00);color:#fff;border:none;padding:15px;border-radius:14px;font-weight:700;font-size:17px;margin-top:10px}
.total{font-size:28px;color:#ff6f00;font-weight:800}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;left:0;top:0;width:100%;margin:0}}
</style>
</head>
<body>
<div class="h"><h2 style="margin:0">🕉️ Shiv Shakti</h2><div>Building Materials & Traders</div></div>

<div class="box">
<h3 style="margin:0 0 10px">New Bill</h3>
<input id="cname" placeholder="Client ka Naam">
<input id="cmob" placeholder="Mobile Number - 10 digit">
</div>

<div class="box">
<b>Items</b>
<div class="row"><div style="flex:1">Cement - 200 Rs</div><button class="btn" onclick="chg1(-1)">-</button><input id="q1" class="qty" value="0"><button class="btn btn2" onclick="chg1(1)">+</button></div>
<div class="row"><div style="flex:1">Ret - 1000 Rs</div><button class="btn" onclick="chg2(-1)">-</button><input id="q2" class="qty" value="0"><button class="btn btn2" onclick="chg2(1)">+</button></div>
<hr>
<div style="display:flex;justify-content:space-between"><b>Total Amount</b><span id="t" class="total">₹0</span></div>
<button class="mainbtn" onclick="window.print()">🖨️ Bill Banao / Print Karo</button>
</div>

<div class="box" id="print">
<h2 style="text-align:center;margin:0">Shiv Shakti</h2>
<p style="text-align:center">Date: <span id="d"></span></p><hr>
<p>Client: <b id="bc"></b></p><p>Mobile: <b id="bm"></b></p><hr>
<p>Cement: <span id="bq1"></span> x 200 = <span id="bt1"></span></p>
<p>Ret: <span id="bq2"></span> x 1000 = <span id="bt2"></span></p><hr>
<h3>Total: ₹<span id="bt"></span></h3>
</div>

<script>
let q1=0,q2=0;
function chg1(v){q1=Math.max(0,q1+v);document.getElementById('q1').value=q1;upd()}
function chg2(v){q2=Math.max(0,q2+v);document.getElementById('q2').value=q2;upd()}
function upd(){
let t1=q1*200,t2=q2*1000,tt=t1+t2;
document.getElementById('t').innerText='₹'+tt;
document.getElementById('d').innerText=new Date().toLocaleDateString('en-IN');
document.getElementById('bc').innerText=document.getElementById('cname').value;
document.getElementById('bm').innerText=document.getElementById('cmob').value;
document.getElementById('bq1').innerText=q1;document.getElementById('bt1').innerText=t1;
document.getElementById('bq2').innerText=q2;document.getElementById('bt2').innerText=t2;
document.getElementById('bt').innerText=tt;
}
document.getElementById('cname').oninput=upd;document.getElementById('cmob').oninput=upd;
</script>
</body>
</html>
